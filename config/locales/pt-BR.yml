pt-BR:
  # ── Datas e formatos ──────────────────────────────────────────────────────────
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d/%m"
      long: "%d de %B de %Y"

  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d/%m %H:%M"
      long: "%d de %B de %Y às %H:%M"

  # ── ActiveRecord ──────────────────────────────────────────────────────────────
