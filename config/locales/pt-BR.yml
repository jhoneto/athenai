        kind: "Tipo"
        description: "Descrição"
      "connector/action":
        name: "Nome"
        kind: "Tipo"
        description: "Descrição"
        definition: "Definição"
        input_schema: "Schema de entrada"

    errors:
      messages:
        record_invalid: "Validação falhou: %{errors}"
