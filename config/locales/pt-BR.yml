      agent: "Agente"
      session: "Conversa"
      message: "Mensagem"
      connector: "Conector"
      "connector/action": "Ação do conector"

    attributes:
      user:
        name: "Nome"
        email: "E-mail"
        password: "Senha"
        password_confirmation: "Confirmação de senha"
        account_name: "Nome da empresa"
      account:
        name: "Nome da empresa"
      plan:
        name: "Nome"
        slug: "Identificador"
        analyses_per_month: "Análises por mês"
